name: Commit Email Summary

on:
  push:
    branches: [main, master]

jobs:
  site_config:
    runs-on: ubuntu-latest
    outputs:
      site_label: ${{ steps.site_config.outputs.site_label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: site_config
        run: node --input-type=module -e 'import { SITE_NAP } from "./src/config/site-config.ts"; console.log(`site_label=${SITE_NAP.name}`)' >> "$GITHUB_OUTPUT"

  email_summary:
    needs: site_config
    uses: Serbyte-Development/actions/.github/workflows/send_commit_email.yaml@v1
    with:
      openai_model: gpt-4.1-mini
      site_label: ${{ needs.site_config.outputs.site_label }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }}
